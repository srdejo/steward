server:
  port: ${SERVER_PORT:8099}

spring:
  application:
    name: steward
  profiles:
    default: dev
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:steward}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    # El Postgres del VPS lo comparten ~13 apps con max_connections=100: 3 conexiones por defecto (design D3).
    pool:
      initial-size: 1
      max-size: ${DB_POOL_MAX:3}
      validation-query: SELECT 1
      max-idle-time: 10m
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:steward}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Sin "groups" en la respuesta: la spec pide solo {"status":"UP"}.
      probes:
        enabled: false

steward:
  zone: America/Bogota
  # Origen de los enlaces de invitacion (design D7).
  public-url: ${STEWARD_PUBLIC_URL:http://steward.test}
  # Los correos salen siempre por la API contact del workspace (design D7): el backend no tiene SMTP.
  contact-api-url: ${CONTACT_API_URL:http://127.0.0.1:3000}
  mail:
    # contact | log. Se decide en ejecucion, no con @Profile, para que la imagen nativa no lo congele (design D2).
    modo: ${STEWARD_MAIL_MODO:contact}
  # Avisos de pagos (avisos-pagos): el programador se apaga con AVISOS_HABILITADOS=false. Las claves las genera Daniel
  # en el VPS; sin AVISOS_SECRET no hay acciones en el aviso, y sin VAPID no hay push en el navegador.
  avisos:
    habilitados: ${AVISOS_HABILITADOS:true}
    envio: ${STEWARD_AVISOS_ENVIO:real}
    secreto: ${AVISOS_SECRET:}
    vapid-publica: ${VAPID_PUBLIC_KEY:}
    vapid-privada: ${VAPID_PRIVATE_KEY:}
    vapid-sujeto: ${VAPID_SUBJECT:}
    expo-token: ${EXPO_ACCESS_TOKEN:}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: 7d
    # El OAuth client "Aplicacion web" de beauty (design D5). Vacio = login con Google deshabilitado.
    google-client-id: ${GOOGLE_CLIENT_ID:}
    # El client iOS de la app (design D3 de app-movil-conectada). Vacio = solo el web.
    google-ios-client-id: ${GOOGLE_IOS_CLIENT_ID:}
    # Sign in with Apple: la audiencia es el bundle id. Equipo, llave y .p8 solo para revocar (design D5).
    apple-client-id: ${APPLE_CLIENT_ID:com.danieljimenez.steward}
    apple-team-id: ${APPLE_TEAM_ID:}
    apple-key-id: ${APPLE_KEY_ID:}
    apple-private-key: ${APPLE_PRIVATE_KEY:}
    # Acceso de desarrollo sin Google (POST /api/auth/dev): apagado por defecto; nunca en el VPS (design D5).
    dev-login: ${STEWARD_DEV_LOGIN:false}

---
spring:
  config:
    activate:
      on-profile: dev

steward:
  # En local contact no suele correr: el enlace de invitacion queda en el log. Con STEWARD_MAIL_MODO=contact, sale por contact.
  mail:
    modo: ${STEWARD_MAIL_MODO:log}
  avisos:
    habilitados: ${AVISOS_HABILITADOS:false}
    envio: ${STEWARD_AVISOS_ENVIO:log}
    secreto: ${AVISOS_SECRET:dev-only-avisos-secret-0123456789abcdef}
  security:
    # En local Google no acepta steward.test como origen: se entra con el acceso de desarrollo.
    dev-login: ${STEWARD_DEV_LOGIN:true}
    jwt-secret: ${JWT_SECRET:dev-only-secret-steward-0123456789abcdef0123456789abcdef0123456789}
